######  Captain Agent Tools Configuration #######
# id: Tool identifier used to resolve the class (Captain::Tools::{PascalCase(id)}Tool)
# title: Human-readable tool name for frontend display
# description: Brief description of what the tool does
# icon: Icon name for frontend display (frontend icon system)
#######################################################

- id: add_contact_note
  title: "Adicionar Nota ao Contato"
  description: "Registra uma observação permanente na ficha do contato no CRM"
  icon: "note-add"

- id: add_private_note
  title: "Adicionar Nota Privada"
  description: "Adiciona uma nota interna privada na conversa para a equipe"
  icon: "eye-off"

- id: update_priority
  title: "Atualizar Prioridade"
  description: "Altera o nível de prioridade da conversa (baixa, média, alta, urgente)"
  icon: "exclamation-triangle"

- id: add_label_to_conversation
  title: "Adicionar Etiqueta à Conversa"
  description: "Classifica a conversa com uma etiqueta oficial do funil"
  icon: "tag"

- id: faq_lookup
  title: "Consultar Base de FAQs"
  description: "Pesquisa respostas aprovadas usando similaridade semântica"
  icon: "search"

- id: shopify_order_lookup
  title: "Consultar Pedido Shopify"
  description: "Localiza pedidos do cliente nas lojas Shopify conectadas por e-mail, telefone ou número"
  icon: "shopping-bag"

- id: calendar_check_availability
  title: "Consultar Disponibilidade de Agenda"
  description: "Consulta horários livres dos profissionais (sincronizados com Google Agenda)"
  icon: "calendar"

- id: calendar_create_appointment
  title: "Criar Agendamento na Agenda"
  description: "Reserva um horário na agenda do profissional, cria evento no Google Agenda e gera link do Meet"
  icon: "calendar-add"

- id: calendar_list_appointments
  title: "Listar Agendamentos & Links Públicos"
  description: "Lista compromissos futuros do contato e retorna os links públicos de agendamento"
  icon: "calendar-clock"

- id: calendar_reschedule_or_cancel
  title: "Reagendar ou Cancelar Compromisso"
  description: "Reagenda para novo horário ou cancela um agendamento existente no Google Agenda"
  icon: "calendar-sync"

- id: resolve_conversation
  title: "Resolver Conversa"
  description: "Marca a conversa como resolvida quando a solicitação foi concluída"
  icon: "checkmark"

- id: request_rating
  title: "Solicitar Avaliação (CSAT)"
  description: "Envia o cartão interativo de avaliação de satisfação CSAT na conversa"
  icon: "star"

- id: handoff
  title: "Transferir para Especialista Humano"
  description: "Transfere imediatamente a conversa para um agente humano da equipe"
  icon: "user-switch"
