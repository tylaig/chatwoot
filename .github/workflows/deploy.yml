name: Build & Deploy Chatwoot Custom

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chatwoot-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate short SHA
        id: vars
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot:latest
            ghcr.io/${{ github.repository_owner }}/chatwoot:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check VPS Configuration
        id: check_vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "has_vps=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ VPS_HOST não configurado nos Secrets do repositório. Deploy remoto ignorado."
          else
            echo "has_vps=true" >> "$GITHUB_OUTPUT"
            echo "✅ VPS_HOST configurado. Prosseguindo com o deploy remoto..."
          fi

      - name: Execute remote deploy
        if: steps.check_vps.outputs.has_vps == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "🚀 Iniciando deploy da versão ${{ needs.build-and-push.outputs.short_sha }} na VPS..."
            cd /opt/chatwoot

            echo "📦 Baixando nova imagem..."
            docker compose pull rails sidekiq

            echo "🔄 Executando migrations e preparação do banco..."
            docker compose run --rm rails bundle exec rails db:chatwoot_prepare

            echo "⚡ Reiniciando containers..."
            docker compose up -d --remove-orphans

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy concluído com sucesso!"
