name: Deploy Games Safari (Protected Manual Only)

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Digite CONFIRMAR-GAMESSAFARI para autorizar o deploy em inbox.gamessafari.com'
        required: true
        default: ''
        type: string
      force_deploy:
        description: 'Forçar deploy mesmo dentro do horário de atendimento (11h-22h BRT)'
        required: false
        default: 'false'
        type: boolean
      image_digest:
        description: 'Digest sha256 de imagem já publicada para deploy-only'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: chatwoot-gamessafari-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Games Safari Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ inputs.confirm_target == 'CONFIRMAR-GAMESSAFARI' }}
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_ref: ${{ steps.digest.outputs.image_ref }}
      image_digest: ${{ steps.digest.outputs.image_digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate short SHA
        id: vars
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build diagnostics
        run: |
          set -euo pipefail
          node --version
          ruby --version || true
          command -v pnpm || echo "pnpm is installed inside the Docker build image"
          git rev-parse HEAD
          df -h
          free -h

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Games Safari Isolated Tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot:gamessafari-stable
            ghcr.io/${{ github.repository_owner }}/chatwoot:gamessafari-${{ steps.vars.outputs.short_sha }}
          # Disable the GHA cache exporter: it repeatedly stalls this protected
          # production build after the image layers are built. Publish directly to
          # GHCR and retain the immutable digest required by the deploy gate.
          provenance: false
          outputs: type=registry

      - name: Export immutable image digest
        id: digest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chatwoot
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built ${IMAGE_NAME}@${IMAGE_DIGEST}"

  deploy:
    name: Deploy to Games Safari VPS (Docker Swarm)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Validate manual confirmation token
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          if [ "$CONFIRM_TARGET" != "CONFIRMAR-GAMESSAFARI" ]; then
            echo "::error::Confirmação inválida. Digite exatamente CONFIRMAR-GAMESSAFARI." >&2
            exit 1
          fi

      - name: Block deploy during support hours (11:00 - 21:59 BRT)
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'false' }}
        run: |
          set -euo pipefail
          hour_brt="$(TZ=America/Sao_Paulo date +%H)"
          now_brt="$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Current time in Brasília: ${now_brt} (hour=${hour_brt})"
          if [ "$FORCE_DEPLOY" != "true" ] && [ "$hour_brt" -ge 11 ] && [ "$hour_brt" -lt 22 ]; then
            echo "::error::Deploy bloqueado durante o horário de atendimento (11:00 às 22:00 BRT). A imagem Docker já foi compilada e salva no GHCR. Rode o deploy após as 22:00 BRT." >&2
            exit 1
          fi

      - name: Checkout deploy helper
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Install SSH key and pin server host fingerprint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/chatwoot_deploy_key
          chmod 600 ~/.ssh/chatwoot_deploy_key
          ssh-keyscan -p "$VPS_PORT" -t ed25519,rsa "$VPS_HOST" > ~/.ssh/known_hosts.candidate 2>/dev/null
          test -s ~/.ssh/known_hosts.candidate
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts.candidate -E sha256 | awk '{print $2}' | sort -u | paste -sd ',' -)"
          case ",$actual," in
            *,"$VPS_HOST_FINGERPRINT",*) ;;
            *)
              echo "VPS host fingerprint mismatch. Expected configured secret; saw: $actual" >&2
              exit 1
              ;;
          esac
          mv ~/.ssh/known_hosts.candidate ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate deploy helper syntax
        run: bash -n scripts/deploy/production_swarm_deploy.sh

      - name: Upload deploy helper
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -P "$VPS_PORT" -i ~/.ssh/chatwoot_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/deploy/production_swarm_deploy.sh "${VPS_USER}@${VPS_HOST}:/opt/chatwoot-deploy/production_swarm_deploy.sh"

      - name: Execute Swarm deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i ~/.ssh/chatwoot_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "IMAGE_REF='${IMAGE_REF}' EXPECTED_DIGEST='${EXPECTED_DIGEST}' GITHUB_SHA='${GITHUB_SHA}' /opt/chatwoot-deploy/production_swarm_deploy.sh"


  deploy-immutable-digest:
    name: Deploy already-published immutable digest
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    if: ${{ inputs.confirm_target == 'CONFIRMAR-GAMESSAFARI' && inputs.image_digest != '' }}
    steps:
      - name: Validate immutable digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Checkout deploy helper
        uses: actions/checkout@v4
        with:
          ref: prod/gamessafari

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_FINGERPRINT; do test -n "${!name}" || exit 1; done

      - name: Install pinned SSH identity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/chatwoot_deploy_key
          chmod 600 ~/.ssh/chatwoot_deploy_key
          ssh-keyscan -p "$VPS_PORT" -t ed25519,rsa "$VPS_HOST" > ~/.ssh/known_hosts.candidate 2>/dev/null
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts.candidate -E sha256 | awk '{print $2}' | sort -u | paste -sd ',' -)"
          if [[ ",$actual," != *,"$VPS_HOST_FINGERPRINT",* ]]; then
            echo "VPS host fingerprint mismatch" >&2
            exit 1
          fi
          mv ~/.ssh/known_hosts.candidate ~/.ssh/known_hosts

      - name: Upload and execute digest-locked deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_REF: ghcr.io/tylaig/chatwoot@${{ inputs.image_digest }}
          EXPECTED_DIGEST: ${{ inputs.image_digest }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash -n scripts/deploy/production_swarm_deploy.sh
          scp -P "$VPS_PORT" -i ~/.ssh/chatwoot_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/deploy/production_swarm_deploy.sh "$VPS_USER@$VPS_HOST:/opt/chatwoot-deploy/production_swarm_deploy.sh"
          # Authenticate the VPS Docker client for this one protected deploy.
          # The token is sent over SSH stdin and never written to logs or disk.
          printf '%s' "$GITHUB_TOKEN" | ssh -p "$VPS_PORT" -i ~/.ssh/chatwoot_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null"
          ssh -p "$VPS_PORT" -i ~/.ssh/chatwoot_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "IMAGE_REF='$IMAGE_REF' EXPECTED_DIGEST='$EXPECTED_DIGEST' GITHUB_SHA='$GITHUB_SHA' /opt/chatwoot-deploy/production_swarm_deploy.sh"
