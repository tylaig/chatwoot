name: Deploy Games Safari (Protected Branch + Off-Hours Auto Rollout)

on:
  push:
    branches:
      - prod/gamessafari
  schedule:
    # 01:05 UTC = 22:05 BRT (America/Sao_Paulo) - aplica automaticamente após o fim do expediente qualquer build feito durante o dia
    - cron: '5 1 * * *'
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Digite CONFIRMAR-GAMESSAFARI para autorizar o deploy manual em inbox.gamessafari.com'
        required: false
        default: 'CONFIRMAR-GAMESSAFARI'
        type: string
      force_deploy:
        description: 'Forçar deploy mesmo dentro do horário de atendimento (11h-22h BRT)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: chatwoot-gamessafari-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Games Safari Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.confirm_target == 'CONFIRMAR-GAMESSAFARI' }}
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_ref: ${{ steps.digest.outputs.image_ref }}
      image_digest: ${{ steps.digest.outputs.image_digest }}
      within_support_hours: ${{ steps.window.outputs.within_support_hours }}
      now_brt: ${{ steps.window.outputs.now_brt }}
    steps:
      - name: Checkout Code (prod/gamessafari)
        uses: actions/checkout@v4
        with:
          ref: prod/gamessafari

      - name: Calculate short SHA & Check Brasília Support Window (11h-22h BRT)
        id: window
        run: |
          hour_brt="$(TZ=America/Sao_Paulo date +%H)"
          now_brt="$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "now_brt=${now_brt}" >> "$GITHUB_OUTPUT"
          if [ "$hour_brt" -ge 11 ] && [ "$hour_brt" -lt 22 ]; then
            echo "within_support_hours=true" >> "$GITHUB_OUTPUT"
            echo "🕒 Horário comercial em Brasília (${now_brt}): A imagem será compilada e salva no GHCR agora, e o deploy na VPS rodará automaticamente às 22:05 BRT."
          else
            echo "within_support_hours=false" >> "$GITHUB_OUTPUT"
            echo "✅ Fora do horário comercial (${now_brt}): Build + Deploy imediato autorizado."
          fi

      - name: Calculate short SHA
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Games Safari Isolated Tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot:gamessafari-stable
            ghcr.io/${{ github.repository_owner }}/chatwoot:gamessafari-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image digest
        id: digest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chatwoot
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built ${IMAGE_NAME}@${IMAGE_DIGEST}"

  deploy:
    name: "Deploy to Games Safari VPS (Off-Hours Only - 22h to 11h BRT)"
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    if: ${{ needs.build-and-push.outputs.within_support_hours == 'false' || inputs.force_deploy == 'true' }}
    steps:
      - name: Verify Brasília Time Window (22:00 - 10:59 BRT)
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
        run: |
          set -euo pipefail
          hour_brt="$(TZ=America/Sao_Paulo date +%H)"
          now_brt="$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Current time in Brasília: ${now_brt} (hour=${hour_brt})"
          if [ "$FORCE_DEPLOY" != "true" ] && [ "$hour_brt" -ge 11 ] && [ "$hour_brt" -lt 22 ]; then
            echo "::notice::Deploy adiado por estar dentro do horário de atendimento (11:00 às 22:00 BRT). O agendamento das 22:05 BRT aplicará automaticamente."
            exit 0
          fi

      - name: Checkout deploy helper
        uses: actions/checkout@v4
        with:
          ref: prod/gamessafari

      - name: Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Install SSH key and pin server host fingerprint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/chatwoot_deploy_key
          chmod 600 ~/.ssh/chatwoot_deploy_key
          ssh-keyscan -p "$VPS_PORT" -t ed25519,rsa "$VPS_HOST" > ~/.ssh/known_hosts.candidate 2>/dev/null
          test -s ~/.ssh/known_hosts.candidate
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts.candidate -E sha256 | awk '{print $2}' | sort -u | paste -sd ',' -)"
          case ",$actual," in
            *,"$VPS_HOST_FINGERPRINT",*) ;;
            *)
              echo "VPS host fingerprint mismatch. Expected configured secret; saw: $actual" >&2
              exit 1
              ;;
          esac
          mv ~/.ssh/known_hosts.candidate ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate deploy helper syntax
        run: bash -n scripts/deploy/production_swarm_deploy.sh

      - name: Upload deploy helper
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -P "$VPS_PORT" -i ~/.ssh/chatwoot_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            scripts/deploy/production_swarm_deploy.sh "${VPS_USER}@${VPS_HOST}:/opt/chatwoot-deploy/production_swarm_deploy.sh"

      - name: Execute Swarm deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i ~/.ssh/chatwoot_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "IMAGE_REF='${IMAGE_REF}' EXPECTED_DIGEST='${EXPECTED_DIGEST}' GITHUB_SHA='${GITHUB_SHA}' /opt/chatwoot-deploy/production_swarm_deploy.sh"
