name: Build Meu Super Chat SaaS Image (Isolated VPS2)

on:
  push:
    branches:
      - meusuperchat
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: meusuperchat-saas-build
  cancel-in-progress: false

jobs:
  build-and-push-saas:
    name: Build & Push Meu Super Chat Image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_ref: ${{ steps.digest.outputs.image_ref }}
      image_digest: ${{ steps.digest.outputs.image_digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate short SHA
        id: vars
        run: |
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Meu Super Chat Isolated Tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatwoot:meusuperchat-latest
            ghcr.io/${{ github.repository_owner }}/chatwoot:meusuperchat-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image digest
        id: digest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chatwoot
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Built Meu Super Chat SaaS Image: ${IMAGE_NAME}@${IMAGE_DIGEST}"
